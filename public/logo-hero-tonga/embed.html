<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Logo 3D — Tonga Tattoo</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html,body{margin:0;height:100%;background:transparent}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh;background:transparent}
</style>
</head>
<body>
<three-d-stage name="tonga-tattoo-logo" background="transparent" autorotate></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

/* Ocultar la barra de descarga y la nota de uso: esto es un embed del hero, no la demo */
{ const sr = stage.shadowRoot, st = document.createElement('style');
  st.textContent = '.toolbar{display:none!important}.note{display:none!important}';
  sr.appendChild(st); }

const K = 4, SW = 640, SH = 760, W = SW * K, H = SH * K;
const S = 0.6 / W, CX = W / 2;
const src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = 'logo-tonga.png'; });

// script ink mask (black only), softened before thresholding
const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
const g = cv.getContext('2d', { willReadFrequently: true });
g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
g.filter = 'blur(' + (K * 0.55) + 'px)'; g.drawImage(src, 0, 0, W, H); g.filter = 'none';
const px = g.getImageData(0, 0, W, H).data, inkMask = new Uint8Array(W * H);
for (let i = 0; i < W * H; i++) {
  const r = px[i * 4], gg = px[i * 4 + 1], b = px[i * 4 + 2];
  inkMask[i] = (0.3 * r + 0.59 * gg + 0.11 * b < 175 && r - b < 60) ? 1 : 0;
}

// marching squares → closed loops (in px)
function trace(m) {
  const at = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? 0 : m[y * W + x];
  const pts = new Map(), adj = new Map();
  const key = (x, y, e) => e === 0 ? `h${x},${y}` : `v${x},${y}`; // h: edge between (x,y)-(x+1,y); v: (x,y)-(x,y+1)
  const pos = (k) => {
    const [a, b] = k.slice(1).split(',').map(Number);
    return k[0] === 'h' ? [a + 0.5, b] : [a, b + 0.5];
  };
  const link = (a, b) => {
    if (!adj.has(a)) adj.set(a, []); if (!adj.has(b)) adj.set(b, []);
    adj.get(a).push(b); adj.get(b).push(a);
  };
  for (let y = -1; y < H; y++) for (let x = -1; x < W; x++) {
    const tl = at(x, y), tr = at(x + 1, y), br = at(x + 1, y + 1), bl = at(x, y + 1);
    const c = tl * 8 + tr * 4 + br * 2 + bl;
    if (c === 0 || c === 15) continue;
    const T = key(x, y, 0), B = key(x, y + 1, 0), L = key(x, y, 1), R = key(x + 1, y, 1);
    switch (c) {
      case 1: case 14: link(L, B); break;
      case 2: case 13: link(B, R); break;
      case 3: case 12: link(L, R); break;
      case 4: case 11: link(T, R); break;
      case 6: case 9: link(T, B); break;
      case 7: case 8: link(L, T); break;
      case 5: link(L, T); link(B, R); break;
      case 10: link(T, R); link(L, B); break;
    }
  }
  const seen = new Set(), loops = [];
  for (const start of adj.keys()) {
    if (seen.has(start)) continue;
    const loop = []; let prev = null, cur = start;
    while (cur && !seen.has(cur)) {
      seen.add(cur); loop.push(pos(cur));
      const n = adj.get(cur).find(k => k !== prev && !seen.has(k));
      prev = cur; cur = n;
    }
    if (loop.length > 8) loops.push(loop);
  }
  return loops;
}

function rdp(p, eps) {
  if (p.length < 3) return p;
  let dmax = 0, idx = 0; const [a, b] = [p[0], p[p.length - 1]];
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
  for (let i = 1; i < p.length - 1; i++) {
    const d = Math.abs(dy * p[i][0] - dx * p[i][1] + b[0] * a[1] - b[1] * a[0]) / len;
    if (d > dmax) { dmax = d; idx = i; }
  }
  if (dmax > eps) return rdp(p.slice(0, idx + 1), eps).slice(0, -1).concat(rdp(p.slice(idx), eps));
  return [a, b];
}
const area = (p) => { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; };
const inside = (pt, poly) => {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
};

function shapesFrom(m) {
  const smooth = (l, n) => { for (let k = 0; k < n; k++) { const o = []; for (let i = 0; i < l.length; i++) { const a = l[i], b = l[(i + 1) % l.length]; o.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]); } l = o; } return l; };
  const avg = (l, r) => l.map((_, i) => { let x = 0, y = 0; for (let j = -r; j <= r; j++) { const q = l[(i + j + l.length) % l.length]; x += q[0]; y += q[1]; } return [x / (2 * r + 1), y / (2 * r + 1)]; });
  const loops = trace(m).map(l => { l = avg(l, 3); const mid = Math.floor(l.length / 2); const a = rdp(l.slice(0, mid + 1), 0.6), b = rdp(l.slice(mid), 0.6); return smooth(a.slice(0, -1).concat(b.slice(0, -1)), 1); })
    .filter(l => l.length >= 3 && Math.abs(area(l)) > 40);
  const depth = loops.map((l, i) => loops.reduce((n, o, j) => n + (j !== i && Math.abs(area(o)) > Math.abs(area(l)) && inside(l[0], o) ? 1 : 0), 0));
  const toV = (l, cw) => { let v = l.map(([x, y]) => new THREE.Vector2((x - CX) * S, (H - y) * S)); if (THREE.ShapeUtils.isClockWise(v) !== cw) v.reverse(); return v; };
  const outers = [];
  loops.forEach((l, i) => { if (depth[i] % 2 === 0) outers.push({ i, shape: new THREE.Shape(toV(l, false)) }); });
  loops.forEach((l, i) => {
    if (depth[i] % 2 === 0) return;
    let best = null;
    for (const o of outers) if (depth[o.i] === depth[i] - 1 && inside(l[0], loops[o.i]) && (!best || Math.abs(area(loops[o.i])) < Math.abs(area(loops[best.i])))) best = o;
    if (best) best.shape.holes.push(new THREE.Path(toV(l, true)));
  });
  return outers.map(o => o.shape);
}

const P = (x, y) => [(x * K - CX) * S, (H - y * K) * S]; // image px → meters
const ink = new THREE.MeshStandardMaterial({ name: 'tinta', color: 0x1a1918, roughness: 0.3, metalness: 0.1 });
const gold = new THREE.MeshStandardMaterial({ name: 'oro', color: 0xd08c1f, roughness: 0.42, metalness: 0.25 });

const model = new THREE.Group(); model.name = 'tonga_tattoo_logo';
const D = 0.045, d = 0.007;
const TS = 0.72, TCX = 323.5, TCY = 365.5; // TT size relative to the original
const tsx = x => TCX + (x - TCX) * TS, tsy = y => TCY + (y - TCY) * TS;
function tShape(x0, x1, sx0, sx1) {
  const pts = [[x0, 166], [x1, 166], [x1, 220], [sx1, 220], [sx1, 565], [sx0, 565], [sx0, 220], [x0, 220]].map(([x, y]) => new THREE.Vector2(...P(tsx(x), tsy(y))));
  return new THREE.Shape(pts.reverse());
}
const goldGeo = new THREE.ExtrudeGeometry([tShape(79, 313, 171, 221), tShape(334, 568, 426, 476)], { depth: D, bevelEnabled: true, bevelThickness: 0.0015, bevelSize: 0.0012, bevelOffset: -0.0012, bevelSegments: 3 });
goldGeo.translate(0, 0, -D / 2);
const tt = new THREE.Mesh(goldGeo, gold); tt.name = 'TT';
const scriptGeo = new THREE.ExtrudeGeometry(shapesFrom(inkMask), { depth: d, curveSegments: 4, bevelEnabled: true, bevelThickness: 0.0006, bevelSize: 0.00045, bevelOffset: -0.00045, bevelSegments: 2 });
scriptGeo.computeVertexNormals();
const script = new THREE.Mesh(scriptGeo, ink); script.name = 'Tonga_Tattoo_firma';
script.position.z = D / 2 + 0.0008;
model.add(tt, script);

// rest on y=0, center x/z
const box0 = new THREE.Box3().setFromObject(model);
const off = new THREE.Vector3(-(box0.min.x + box0.max.x) / 2, -box0.min.y, 0);
model.position.copy(off);
const root = new THREE.Group(); root.name = 'logo'; root.add(model);
stage.setObject(root);

/* Encuadre que respeta el ancho Y el alto del hueco disponible: en móvil
   (muy estrecho y vertical) el logo es ancho, así que si solo se mira el
   alto se sale por los lados. Se recalcula en cada resize/orientación. */
const camDir = new THREE.Vector3(0.22, 0.08, 1).normalize();
function fitCamera() {
  const cam = stage._camera, controls = stage._controls;
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
  cam.aspect = w / h;
  const box2 = new THREE.Box3().setFromObject(root);
  const size = box2.getSize(new THREE.Vector3());
  const center = box2.getCenter(new THREE.Vector3());
  const vFov = (cam.fov * Math.PI) / 180;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * cam.aspect);
  const distV = (size.y / 2) / Math.tan(vFov / 2);
  const distH = (size.x / 2) / Math.tan(hFov / 2);
  const dist = Math.max(distV, distH) * 1.3;
  controls.target.copy(center);
  cam.position.copy(center).addScaledVector(camDir, dist);
  cam.near = dist / 100; cam.far = dist * 100;
  cam.updateProjectionMatrix();
  controls.update();
}
fitCamera();
new ResizeObserver(fitCamera).observe(stage);
window.addEventListener('orientationchange', () => setTimeout(fitCamera, 200));

/* El padre (Next.js) manda el progreso de scroll (0 arriba del todo, 1 al
   bajar una pantalla): el modelo se inclina y se hunde un poco, sumado al
   giro automático que ya trae el stage. */
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  const d = e.data || {};
  if (d.type === 'logo-hero:scroll') {
    const p = Math.max(0, Math.min(1, d.progress));
    root.rotation.x = -p * 0.45;
    root.position.y = -p * 0.1;
  } else if (d.type === 'logo-hero:spin' && typeof d.deltaYaw === 'number') {
    root.rotation.y += d.deltaYaw;
  }
});

/* Avisar al padre (Next.js) cuando el modelo está listo, para quitar el fallback/loader */
window.parent.postMessage({ type: 'logo-hero:listo' }, location.origin);
</script>
</body>
</html>
